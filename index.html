<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café & Código | Linktree</title>

  <!-- Estilos do Tailwind em um arquivo local. -->
  <link rel="stylesheet" href="tailwind.css">

  <!-- Seu CSS personalizado fica neste arquivo. -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex items-center justify-center bg-zinc-950 p-6 text-zinc-100">

  <main class="w-full max-w-sm text-center">

    <!-- Perfil: você pode trocar as iniciais, o nome e a descrição. -->
    <header class="mb-8">
      <div class="mx-auto mb-5 flex h-24 w-24 items-center justify-center rounded-full border-2 border-orange-300 bg-zinc-900 font-mono text-3xl font-bold text-orange-300" aria-hidden="true">
        C/C
      </div>

      <h1 class="text-3xl font-bold">Café &amp; Código</h1>
      <p class="mt-2 text-sm text-orange-300">@cafe.codigo</p>
      <p class="mt-4 text-base leading-relaxed text-zinc-400">
        Um pouco de café, tecnologia<br>e boas ideias.
      </p>
    </header>

    <!-- Botões ilustrativos: href="#" mantém o visitante nesta página. -->
    <nav class="space-y-4" aria-label="Links de exemplo">
      <a href="#" class="botao block rounded-xl bg-orange-300 p-4 font-semibold text-zinc-950 hover:bg-orange-200">
        Meu portfólio
      </a>

      <a href="#" class="botao block rounded-xl border border-zinc-700 bg-zinc-900 p-4 font-semibold hover:bg-zinc-800">
        GitHub
      </a>

      <a href="#" class="botao block rounded-xl border border-zinc-700 bg-zinc-900 p-4 font-semibold hover:bg-zinc-800">
        Instagram
      </a>

      <a href="#" class="botao block rounded-xl border border-zinc-700 bg-zinc-900 p-4 font-semibold hover:bg-zinc-800">
        Fale comigo
      </a>
    </nav>

    <footer class="mt-8 text-sm text-zinc-400">
      Feito com café e criatividade.
    </footer>

  </main>
</body>
</html>
